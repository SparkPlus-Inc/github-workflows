name: "🛡️ GitHub Actions セキュリティチェック"

# GitHub Actions のワークフロー / action 定義を、ghalint（permissions 未設定・アクションの SHA 未固定などのポリシー違反）と
# zizmor（静的解析。severity HIGH 以上の検出）でチェックし、検出があればマージをブロックする。
# 課金はジョブ単位で 1 分に切り上げられるため、数十秒で終わる 2 つのチェックを 1 ジョブにまとめている。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「Actions 関連ファイルが変更されたか」の判定は本ワークフロー内でチェックごとに行う。
#    対象ファイルの変更がないチェックは skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、対象外の PR でも合格できる必要がある）。
#    なお ghalint run は個別ファイル指定ができないため、実行時は .github/workflows/ 全体が対象になる。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:  # Free プラン運用の caller から呼ばれる（docs/SETUP/FREE.md）

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: actions-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "GitHub Actions 設定をスキャン"
    # 軽量ジョブのため 1 vCPU ランナーで実行する（2 vCPU の 1/3 の単価。15 分で強制終了される）
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: "スキャン対象を判定"
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          list-files: json
          # 削除ファイルはスキャンできないため対象外（rename は added + deleted に分解され新パス側が対象になる）。
          # ghalint: 削除のみの変更は残りのファイルの lint 結果を変えないため対象外。設定ファイルはポリシーの除外設定に
          #   影響するため対象（ghalint の自動探索パス ^(\.|\.github/)?ghalint\.ya?ml$ をすべて列挙）
          filters: |
            ghalint:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "ghalint.yml"
              - added|modified|copied: "ghalint.yaml"
              - added|modified|copied: ".ghalint.yml"
              - added|modified|copied: ".ghalint.yaml"
              - added|modified|copied: ".github/ghalint.yml"
              - added|modified|copied: ".github/ghalint.yaml"
            zizmor_config:
              - added|modified|copied: ".github/zizmor.yml"
            zizmor_targets:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
              - added|modified|copied: "action.yml"
              - added|modified|copied: "action.yaml"
              - added|modified|copied: "**/action.yml"
              - added|modified|copied: "**/action.yaml"

      - name: "Checkout"
        if: >-
          steps.filter.outputs.ghalint == 'true' ||
          steps.filter.outputs.zizmor_config == 'true' || steps.filter.outputs.zizmor_targets == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # チェックの実行要否は Install の outcome で判定する（対象外なら Install が skip されチェックも skip される）
      - name: "Install ghalint"
        id: install-ghalint
        if: steps.filter.outputs.ghalint == 'true'
        shell: bash
        env:
          VERSION: 1.5.6
          # ghalint_{version}_linux_amd64.tar.gz の SHA256（公式 checksums から確定）
          SHA256: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c
        run: |
          set -euo pipefail
          ARCHIVE="ghalint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" ghalint
          rm -f "$ARCHIVE"
          ghalint version

      - name: "Install zizmor"
        id: install-zizmor
        if: steps.filter.outputs.zizmor_config == 'true' || steps.filter.outputs.zizmor_targets == 'true'
        shell: bash
        env:
          VERSION: 1.27.0
          # zizmor-x86_64-unknown-linux-gnu.tar.gz の SHA256（リリースアセットの digest から確定）
          SHA256: 277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f
        run: |
          set -euo pipefail
          ARCHIVE="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" zizmor
          rm -f "$ARCHIVE"
          zizmor --version

      - name: "ghalint"
        if: steps.install-ghalint.outcome == 'success'
        shell: bash
        env:
          GHALINT_LOG_COLOR: never  # annotation 生成のログ解析を色コードで壊さない
        run: |
          set -euo pipefail
          rc=0
          ghalint run 2>ghalint.log || rc=$?
          cat ghalint.log

          # ghalint は行番号を出力しないため、違反はワークフローファイル単位で PR に annotation 表示する
          if [ "${rc}" -ne 0 ] && [ -s ghalint.log ]; then
            grep ' ERR ' ghalint.log | while IFS= read -r line; do
              file=$(sed -n 's/.* workflow_file_path=\([^ ]*\).*/\1/p' <<< "${line}")
              policy=$(sed -n 's/.* policy_name=\([^ ]*\).*/\1/p' <<< "${line}")
              error=$(sed -n 's/.* error="\([^"]*\)".*/\1/p' <<< "${line}")
              if [ -n "${file}" ]; then
                echo "::error file=${file}::ghalint (${policy}): ${error}"
              fi
            done
          fi
          exit "${rc}"

      - name: "zizmor のインライン ignore コメントの禁止"
        # zizmor の --no-ignores は承認必須の .github/zizmor.yml による抑制まで無効化してしまうため、
        # インラインコメントのトークンの存在自体を禁止する（抑制は .github/zizmor.yml に限定する）。
        # 検査対象は zizmor がスキャンし得る Actions 関連ファイルのみ（ドキュメント等の誤検知を避ける）。
        # ghalint が fail しても zizmor の結果は出す
        if: ${{ !cancelled() && steps.install-zizmor.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git grep -InE 'zizmor:[[:space:]]*ignore' -- \
            ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' \
            ':(glob)**/action.yml' ':(glob)**/action.yaml'; then
            echo "::error::インラインの ignore コメントは使用できません。.github/zizmor.yml で抑制してください（変更にはセキュリティチームの承認が必要）"
            exit 1
          fi

      - name: "zizmor スキャン"
        if: ${{ !cancelled() && steps.install-zizmor.outcome == 'success' }}
        shell: bash
        env:
          # GH_TOKEN があると online audit（impostor-commit / known-vulnerable-actions 等）も有効になる
          GH_TOKEN: ${{ github.token }}
          # 設定ファイルは全ファイルの検出結果に影響するため、変更時は repo 全体をスキャン
          SCAN_ALL: ${{ steps.filter.outputs.zizmor_config }}
          TARGETS: ${{ steps.filter.outputs.zizmor_targets_files }}
        run: |
          set -euo pipefail
          # 設定ファイルの自動探索はリポジトリ直下や入力ファイルの祖先ディレクトリの zizmor.yml / zizmor.yaml
          # にも及び、承認必須（2.5）の対象外パスから検出を抑制できてしまうため、
          # 承認必須の .github/zizmor.yml に固定する（未作成なら設定なしで実行する）
          config_args=(--no-config)
          if [ -f .github/zizmor.yml ]; then
            config_args=(--config .github/zizmor.yml)
          fi

          # --format github: 検出箇所を PR に annotation 表示する
          if [ "${SCAN_ALL}" = "true" ]; then
            zizmor --no-progress --format github --min-severity high "${config_args[@]}" .
            exit 0
          fi

          targets=()
          while IFS= read -r t; do
            if [ -n "${t}" ]; then targets+=("${t}"); fi
          done < <(jq -r '.[]' <<< "${TARGETS}")
          zizmor --no-progress --format github --min-severity high "${config_args[@]}" "${targets[@]}"
