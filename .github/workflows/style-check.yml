name: "✏️ スタイルチェック"

# GitHub Actions のワークフロー定義を actionlint で構文チェックし、Terraform の定義ファイルを tflint で lint する。
# 課金はジョブ単位で 1 分に切り上げられるため、数十秒で終わる 2 つの lint を 1 ジョブにまとめている。
#
# ⚠️ 必須ワークフローは on: のフィルタ（paths / branches / types 等）が無視され全 PR で起動されるため、
#    「対象ファイルが変更されたか」の判定は本ワークフロー内で lint ごとに行う。
#    対象ファイルの変更がない lint は skip し、run 全体は success になる
#    （ルールセットが All repositories 適用のため、Terraform 未使用の repo や対象外の PR でも合格できる必要がある）。
#
# tflint の設定ファイル（.tflint.hcl）は「実行ディレクトリ自身のもの > リポジトリ直下のもの」の優先で適用する
# （tflint は --chdir 先でリポジトリ直下の設定を自動では読まないため、直下の設定は --config で明示する）。
# どちらも無ければ組み込み terraform ruleset の recommended プリセットで lint される。
# plugin（provider ruleset 等）は .tflint.hcl で宣言すれば実行前の tflint --init で導入される。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:  # Free プラン運用の caller から呼ばれる（docs/SETUP/FREE.md）

permissions:
  contents: read
  pull-requests: read  # paths-filter の変更ファイル一覧取得に必要

# 同一 PR に連投された run のみ束ねて追い越しキャンセル
concurrency:
  group: style-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: "workflow 構文チェック / Terraform を lint"
    # 軽量ジョブのため 1 vCPU ランナーで実行する（2 vCPU の 1/3 の単価。15 分で強制終了される）
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: "lint 対象を判定"
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          list-files: json
          # 削除ファイルは lint できないため対象外（rename は added + deleted に分解され新パス側が対象になる）
          filters: |
            actionlint_config:
              - added|modified|copied: ".github/actionlint.yml"
              - added|modified|copied: ".github/actionlint.yaml"
            workflows:
              - added|modified|copied: ".github/workflows/*.yml"
              - added|modified|copied: ".github/workflows/*.yaml"
            tflint_config:
              - added|modified|copied: ".tflint.hcl"
              - added|modified|copied: "**/.tflint.hcl"
            terraform:
              - added|modified|copied: "**/*.tf"
              - added|modified|copied: "**/*.tf.json"
              - added|modified|copied: "**/*.tfvars"
              - added|modified|copied: "**/*.tfvars.json"

      - name: "Checkout"
        if: >-
          steps.filter.outputs.actionlint_config == 'true' || steps.filter.outputs.workflows == 'true' ||
          steps.filter.outputs.tflint_config == 'true' || steps.filter.outputs.terraform == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # lint の実行要否は Install の outcome で判定する（対象外なら Install が skip され lint も skip される）
      - name: "Install actionlint"
        id: install-actionlint
        if: steps.filter.outputs.actionlint_config == 'true' || steps.filter.outputs.workflows == 'true'
        shell: bash
        env:
          VERSION: 1.7.12
          # actionlint_{version}_linux_amd64.tar.gz の SHA256（公式 checksums から確定）
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo tar -xz -C /usr/local/bin -f "$ARCHIVE" actionlint
          rm -f "$ARCHIVE"
          actionlint --version

      - name: "Install tflint"
        id: install-tflint
        if: steps.filter.outputs.tflint_config == 'true' || steps.filter.outputs.terraform == 'true'
        shell: bash
        env:
          VERSION: 0.64.0
          # tflint_linux_amd64.zip の SHA256（公式 checksums.txt から確定）
          SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          set -euo pipefail
          ARCHIVE="tflint_linux_amd64.zip"
          curl -sSfL -o "$ARCHIVE" "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/${ARCHIVE}"

          # SHA-256 検証（改ざん・破損を検知）
          echo "${SHA256}  ${ARCHIVE}" | sha256sum -c -

          sudo unzip -o "$ARCHIVE" tflint -d /usr/local/bin
          sudo chmod +x /usr/local/bin/tflint
          rm -f "$ARCHIVE"
          tflint --version

      - name: "actionlint"
        if: steps.install-actionlint.outcome == 'success'
        shell: bash
        env:
          # 設定ファイルは全ファイルの検出結果に影響するため、変更時は全ワークフローを lint
          SCAN_ALL: ${{ steps.filter.outputs.actionlint_config }}
          TARGETS: ${{ steps.filter.outputs.workflows_files }}
        run: |
          set -euo pipefail
          # workflow command 形式で出力し、検出箇所を PR に annotation 表示する
          FORMAT=$'{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
          if [ "${SCAN_ALL}" = "true" ]; then
            actionlint -format "${FORMAT}"
            exit 0
          fi

          targets=()
          while IFS= read -r t; do
            if [ -n "${t}" ]; then targets+=("${t}"); fi
          done < <(jq -r '.[]' <<< "${TARGETS}")
          actionlint -format "${FORMAT}" "${targets[@]}"

      - name: "tflint"
        # actionlint が fail しても tflint の結果は出す
        if: ${{ !cancelled() && steps.install-tflint.outcome == 'success' }}
        shell: bash
        env:
          # plugin を使う repo の tflint --init が GitHub Releases から取得する際の rate limit 対策
          GITHUB_TOKEN: ${{ github.token }}
          # 設定ファイルは全ディレクトリの検出結果に影響するため、変更時は全ディレクトリを lint
          SCAN_ALL: ${{ steps.filter.outputs.tflint_config }}
          TARGETS: ${{ steps.filter.outputs.terraform_files }}
        run: |
          set -euo pipefail

          # lint はディレクトリ（モジュール）単位のため、変更ファイルをディレクトリに集約する。
          # .terraform はキャッシュ・vendored モジュール置き場のため lint 対象外
          if [ "${SCAN_ALL}" = "true" ]; then
            dirs=$(
              find . \( -path ./.git -o -name .terraform \) -prune -o \
                -type f \( -name '*.tf' -o -name '*.tf.json' \) -print \
              | sed 's|^\./||' \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          else
            dirs=$(
              jq -r '.[]' <<< "${TARGETS}" | { grep -Ev '(^|/)\.terraform/' || true; } \
              | while IFS= read -r f; do dirname "${f}"; done | sort -u
            )
          fi

          status=0
          while IFS= read -r dir; do
            if [ -z "${dir}" ]; then continue; fi
            echo "::group::${dir}"

            args=()
            if [ "${dir}" != "." ] && [ ! -f "${dir}/.tflint.hcl" ] && [ -f .tflint.hcl ]; then
              args=(--config="${PWD}/.tflint.hcl")
            fi

            tflint --chdir="${dir}" "${args[@]}" --init
            result="${RUNNER_TEMP}/tflint.json"
            code=0
            tflint --chdir="${dir}" "${args[@]}" --format=json > "${result}" || code=$?
            if [ "${code}" -ne 0 ]; then status=1; fi

            # 検出箇所を PR に annotation 表示する（filename は --chdir 実行でもリポジトリルート基準で出力される）
            jq -r '
              ((.issues // [])[]
                | "::error file=\(.range.filename),line=\(.range.start.line)::tflint (\(.rule.name)): \(.message)"),
              ((.errors // [])[]
                | if .range then "::error file=\(.range.filename),line=\(.range.start.line)::tflint: \(.message)"
                  else "::error::tflint: \(.message)" end)
            ' "${result}"
            echo "::endgroup::"
          done <<< "${dirs}"
          exit "${status}"
